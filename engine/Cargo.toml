[workspace]
resolver = "2"
members = [
    "crates/geometry",
    "crates/materials",
    "crates/pattern",
    "crates/ffi",
    # Not optional bookkeeping. A crate that exists on disk but is absent from
    # this list is compiled by nothing: `cargo test --workspace`, clippy,
    # rustdoc and `cargo deny` all walk the member list, so every CI job would
    # stay green while the crate was never built at all.
    "crates/export",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# The version this workspace is built and tested against — see
# /rust-toolchain.toml at the repository root, which pins exactly this.
# Not a guessed-lower MSRV floor: a claim this crate compiles on some older
# toolchain would be untested and untrue until someone actually verifies it.
rust-version = "1.97.1"
authors = ["satex25"]
# Proprietary: see the LICENSE at the repository root. `publish = false` is the
# machine-enforced half of that — these crates cannot reach crates.io by accident.
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
# v4 for minting ids, serde so an id is just a string on the wire and
# interoperable with Swift's Foundation.UUID.
uuid = { version = "1", features = ["v4", "serde"] }
proptest = "1"
# `html_reports` off: the extra plotting dependency tree buys a chart
# nobody reads in a project whose benchmark question is a yes/no budget check.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[profile.release]
lto = true
