[package]
name = "patal-desktop"
version = "0.1.0"
description = "Patal desktop app (Windows/Mac downloadable build)"
authors = ["satex25"]
edition = "2021"
# See /rust-toolchain.toml at the repository root — that's what this is
# actually built and tested against, not a guessed-lower MSRV floor.
rust-version = "1.97.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "patal_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
patal-geometry = { path = "../../../engine/crates/geometry" }
patal-pattern = { path = "../../../engine/crates/pattern" }

