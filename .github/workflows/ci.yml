name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Feeds the `advisories` job only. Monday 06:00 UTC.
    - cron: '0 6 * * 1'

# Cancel superseded runs on the same branch/PR rather than let them queue.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  engine:
    name: engine (Rust workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # rust-toolchain.toml at the repo root pins the exact channel and
      # components; rustup (preinstalled on GitHub runners) picks it up
      # automatically the first time cargo/rustc runs in this checkout.
      - name: Resolve pinned toolchain
        run: rustup show

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: ${{ runner.os }}-cargo-engine-${{ hashFiles('engine/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-engine-

      - name: cargo fmt --check
        working-directory: engine
        run: cargo fmt --check

      - name: cargo clippy -D warnings
        working-directory: engine
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        working-directory: engine
        run: cargo test --workspace --locked

      # `cargo doc` rejects `-D`; the flag has to reach rustdoc through the
      # environment. `cargo doc --no-deps -D warnings` fails with
      # "unexpected argument '-D' found" and documents nothing.
      - name: cargo doc (broken intra-doc links are errors)
        working-directory: engine
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --workspace --locked

      - name: cargo deny (licenses, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: engine/Cargo.toml
          # Advisories deliberately excluded — they run on a schedule in
          # their own non-blocking job. These three are pure functions of
          # Cargo.lock, so a red result here is always caused by the commit
          # under test.
          command: check licenses bans sources

  # Split out and non-blocking on purpose. The RustSec database changes
  # under us: an advisory published overnight would otherwise turn an
  # unrelated pull request red for a reason its author cannot act on, and
  # a gate that goes red for reasons you cannot act on is one people learn
  # to ignore. This reports; it does not block.
  advisories:
    name: advisories (RustSec, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: engine/Cargo.toml
          command: check advisories

  # The only platform Pātāl is actually developed on, and until now the one
  # platform CI never built. Cheapest job in the matrix; covers 100% of
  # local development.
  engine-windows:
    name: engine (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve pinned toolchain
        run: rustup show

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: ${{ runner.os }}-cargo-engine-${{ hashFiles('engine/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-engine-

      - name: cargo test
        working-directory: engine
        run: cargo test --workspace --locked

  desktop:
    name: desktop (Tauri + frontend)
    # macOS avoids guessing at webkit2gtk/libayatana-appindicator apt
    # package names for a Linux Tauri build — the Rust side here links
    # native WKWebView on macOS, so `cargo check`/`clippy` need nothing
    # beyond the Xcode Command Line Tools already on this runner. The
    # README's desktop target is Mac/Windows, not Linux, so this matches.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve pinned toolchain
        run: rustup show

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-desktop-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-desktop-

      - name: cargo clippy -D warnings
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      # The harness has real tests now — it writes a .patal file to disk and
      # reads it back, which is the only place in the repo that exercises the
      # document format through an actual file.
      - name: cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked

      - uses: actions/setup-node@v5
        with:
          node-version-file: apps/desktop/.nvmrc
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: npm ci
        working-directory: apps/desktop
        run: npm ci

      - name: npm run build
        working-directory: apps/desktop
        run: npm run build

  native:
    name: native (Swift package)
    # Full Xcode (not just Command Line Tools) ships on GitHub's macOS
    # runners, so `swift test` runs for real here even though it can't in
    # every local dev environment — see apps/native/README.md.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: swift build
        working-directory: apps/native
        run: swift build

      - name: swift test
        working-directory: apps/native
        run: swift test
